[project]
name = "data-transform"
version = "0.2.0"
description = "Pipeline ETL para corpus especializados OCR->JSON->Neo4j con modulos EusKorpus"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Juan De La Morena Marzalo" }]
dependencies = [
  "python-dotenv>=1.0",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
scraper = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
]
pdf = [
  "reportlab>=4.0",
  "PyMuPDF>=1.24",
]
schema = [
  "genson>=1.3",
]
graph = [
  "pandas>=2.2",
]
api = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]
all = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
  "lxml>=5.0",
  "reportlab>=4.0",
  "PyMuPDF>=1.24",
  "genson>=1.3",
  "pandas>=2.2",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "pydantic>=2.6",
]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["scripts*", "grafos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
  "live: tests that hit the public BOPV/EHAA site and are skipped unless explicitly enabled",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []
